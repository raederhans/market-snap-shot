# Daily market snapshot settings. Every threshold and list the pipeline uses lives
# here; the whole file is copied into each snapshot's metadata.

benchmark = "SPY"

# Scored against the stock pool's RS distribution (group = etf, status = reference);
# never part of the pool that defines the percentiles.
etf_watchlist = ["SPY", "QQQ", "IWM", "DIA", "RSP", "MDY", "SOXX", "SMH", "XLK", "XLF", "XLE", "XLV", "XLI"]

[universe]
directory_url = "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqtraded.txt"
download_attempts = 3
# The directory has no "common stock" flag. After ETF = N and Test Issue = N, a row
# is dropped by the symbol pattern or by the first matching name rule (case-insensitive;
# order only decides which reason is reported, e.g. a SPAC unit that mentions a warrant).
# "$" is the NYSE-family marker for preferred and other senior issues (BAC$E).
exclude_symbol_pattern = '\$'

# SPAC and equity-linked units only. Partnership or trust units are common equity
# (ET "Common Units", AB "L.P. Units") and must not match.
[[universe.name_rule]]
reason = "unit"
pattern = '-\s*units?\.?\s*$|\bunits?,? each consisting\b|\b(corporate|tangible equity) units?\b'

[[universe.name_rule]]
reason = "warrant"
pattern = '\bwarrants?\b|\(ADW\)'

# ADR names such as AMX say "each representing the right to receive ...".
[[universe.name_rule]]
reason = "right"
pattern = '\brights?\b'
unless = 'representing the right to receive'

# A bare "Depositary Shares" (not American/Global) is a fractional preferred interest
# (WAFDP); "Capital Trust" issues are trust preferreds (DDT).
[[universe.name_rule]]
reason = "preferred"
pattern = '\bpreferred\b|\bpreference\b|\bpfd\b|\bcapital trust\b|^(?!.*\b(american|global)\b).*\bdepositary shares?\b'

[[universe.name_rule]]
reason = "debt"
pattern = '\bnotes?\b|\bdebentures?\b|\bbonds?\b|\bETNs?\b|%'

[[universe.name_rule]]
reason = "structured_product"
pattern = '\bSTRATS\b|\bCorTS\b|\bPPlus\b|corp(orate)? backed|asset-backed|synthetic fixed-income'

# Closed-end funds named "Fund", including Nasdaq's "Closed End Fund" label (which
# also covers some BDCs such as ARCC). Funds named "... Trust" cannot be told from
# REITs by name and stay in.
[[universe.name_rule]]
reason = "fund"
pattern = '\bfund\b'

[eligibility]
# Floors for the ranked stock pool. min_bars cannot go below 253 (all four RS windows).
min_price = 5.0
min_avg_dollar_volume_50d = 5_000_000
min_bars = 253
# Below this many ranked stocks a 1-99 scale is not meaningful: the run fails.
min_ranked_stocks = 100

[prices]
history_calendar_days = 548   # about 18 months, about 378 sessions
batch_size = 100
max_attempts = 3              # per batch, only while a batch returns nothing
backoff_seconds = 20          # doubled after each failed attempt
pause_seconds = 1.0           # between batches

[gates]
# Symbols with usable bars / symbols requested. Below this nothing is published.
min_fetch_success_ratio = 0.95
# Symbols whose last bar is not the benchmark's / symbols with bars.
max_stale_ratio = 0.05

[output]
# Columns computed but not written to the snapshot. The files are published openly and the
# bars come from an unofficial provider, so raw price levels are left out; ratios,
# percentages, ranks and checks stay. An unknown name is a configuration error.
exclude_columns = ["close", "sma50", "sma150", "sma200"]

[validation]
# Forward reconciliation (pipeline.validate): what each published snapshot was followed by.
horizons = [5, 20, 60]                 # holding periods in XNYS sessions
# rs_percentile lower bounds of quintiles 2 to 5; quintile 1 is everything below the first.
rs_quintile_edges = [20, 40, 60, 80]
near_high_within_pct = 10              # "near the 52-week high": distance_from_52w_high_pct >= -10
combo_min_rs_percentile = 80           # combined condition: this percentile or more and all eight template checks
# A group (or the rank-IC sample) with fewer outcomes than this gives null with the reason, not a number.
min_group_size = 20
# Fewer non-overlapping periods than this: every verdict is insufficient_sample.
min_non_overlapping_periods = 12

[publish]
directory = "data"            # in the repository that runs the job; latest.json sits at its top
push_attempts = 3             # each one rebases onto the branch first; never a forced push
