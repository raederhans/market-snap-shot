# Mirror only. `python -m pytest` runs the suites that are complete in this repository.
# remote-mcp/tests/test_technical_intelligence.py is present for the helper that
# test_universe_rank.py imports; some of its own tests need modules that are not mirrored.
[pytest]
testpaths = pipeline/tests remote-mcp/tests/test_universe_rank.py
pythonpath = remote-mcp
