# Historical backfill: reconstructs the validation statistics on about six years of past
# sessions for the stocks listed today and commits two files to data/backfill/. A
# survivorship-biased preliminary reference, kept apart from the forward record in
# data/validation/. Started by hand only: it has no schedule and is not part of the daily
# job. Needs no secret: the workflow's own GITHUB_TOKEN pushes the commit.
name: Historical backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt pytest==9.2.0

      - name: Tests (mocked, no network)
        run: python -m pytest -q

      # Exits non-zero and writes nothing when the benchmark is incomplete or too few symbols
      # return bars. The results stay on the runner until the publish step.
      - name: Run backfill
        run: python -m pipeline.backfill --out "$RUNNER_TEMP/backfill"

      # One commit holding data/backfill/ only; rebased if the branch moved, never forced.
      - name: Publish backfill to data/backfill/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pipeline.publish --backfill "$RUNNER_TEMP/backfill" --branch "$GITHUB_REF_NAME"
