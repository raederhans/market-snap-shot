# Builds the daily relative-strength snapshot and commits it to data/ on the branch
# the run started from (the default branch for scheduled runs). Features and rankings
# only: no signals. Needs no secret: the workflow's own GITHUB_TOKEN pushes the commit.
#
# The daily commit also keeps the schedule alive: GitHub disables scheduled workflows
# in public repositories after 60 days without repository activity.
name: Daily market snapshot

on:
  schedule:
    - cron: '30 23 * * 1-5'   # weekdays 23:30 UTC, at least 2.5 hours after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt pytest==9.2.0

      - name: Tests (mocked, no network)
        run: python -m pytest -q

      # Exits non-zero when an integrity gate fails; the publish step then never runs.
      - name: Build snapshot
        run: python -m pipeline.run --out "$RUNNER_TEMP/snapshot"

      # A scheduled run keeps a trading day that is already published (a market-holiday
      # run rebuilds the previous session); a manual run replaces it.
      - name: Publish to data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then overwrite="--overwrite"; else overwrite=""; fi
          python -m pipeline.publish --snapshot "$RUNNER_TEMP/snapshot" --branch "$GITHUB_REF_NAME" $overwrite
